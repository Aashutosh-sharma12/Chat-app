# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the Node.js backend (Express + Socket.IO) and the React web client. The mobile app is not deployed here.
services:
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: backend
    plan: free # free instances sleep after ~15 min idle; use "starter" for an always-on chat server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    # One instance only: presence and call state live in server memory.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Secrets: Render asks for these when the Blueprint is created (never commit them).
      - key: MONGO_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Strong random JWT secrets generated by Render.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d

      # Retention
      - key: MEDIA_TTL_HOURS
        value: "24"
      - key: AUDIO_TTL_HOURS
        value: "72"
      - key: MESSAGE_TTL_HOURS
        value: "72"
      - key: MEDIA_CLEANUP_CRON
        value: "*/15 * * * *"

      - key: MAX_UPLOAD_MB
        value: "50"
      - key: DEFAULT_COUNTRY
        value: IN
      - key: CORS_ORIGIN
        value: "*"

      # WebRTC
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  # Web client (React + Vite), served as a free static site.
  - type: web
    name: chat-app-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single page app: every path serves index.html so /chats/123 works on refresh.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Baked into the build; change it and redeploy if the backend URL changes.
      - key: VITE_API_URL
        value: https://chat-app-eckv.onrender.com
